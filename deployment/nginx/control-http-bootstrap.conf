# Temporary HTTP-01 listener. Replace with the TLS configuration after issuance.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name control.csscdn.co.uk;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/control-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        add_header Retry-After "3600" always;
        add_header Cache-Control "no-store" always;
        return 503 "Control V2 is being prepared. Staff access is not available yet.\n";
    }
}
