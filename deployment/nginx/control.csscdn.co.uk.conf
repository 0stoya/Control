# Public TLS setup endpoint. No application/API/auth upstream is enabled.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name control.csscdn.co.uk;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/control-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://control.csscdn.co.uk$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;
    access_log off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name control.csscdn.co.uk;

    ssl_certificate /etc/letsencrypt/live/control.csscdn.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/control.csscdn.co.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ControlSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    access_log off;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "3600" always;

    error_page 503 /_control_setup.html;

    location = /_control_setup.html {
        internal;
        root /var/www/control-setup;
    }

    location = /setup.css {
        root /var/www/control-setup;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
