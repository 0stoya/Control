# Staff gateway; internal ports remain loopback only.
limit_req_zone $binary_remote_addr zone=control_login:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=control_auth:10m rate=60r/m;
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name control.csscdn.co.uk;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/control-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://control.csscdn.co.uk$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;
    access_log off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name control.csscdn.co.uk;

    ssl_certificate /etc/letsencrypt/live/control.csscdn.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/control.csscdn.co.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ControlSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    access_log off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    limit_req_status 429;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control "no-store" always;
    proxy_pass_request_headers off;
    proxy_set_header Host control.csscdn.co.uk;
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Accept $http_accept;
    proxy_connect_timeout 2s;
    proxy_send_timeout 8s;
    proxy_read_timeout 8s;
    proxy_next_upstream off;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;

    location = /auth/login {
        limit_req zone=control_login burst=6 nodelay;
        proxy_pass http://127.0.0.1:8100;
    }
    location ^~ /auth/ {
        limit_req zone=control_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8100;
    }
    location = /api/session { proxy_pass http://127.0.0.1:8100; }
    location = /login { proxy_pass http://127.0.0.1:8100; }
    location = / { proxy_pass http://127.0.0.1:8100; }
    location ^~ /assets/ { proxy_pass http://127.0.0.1:8100; }
    location / { return 404; }
}
