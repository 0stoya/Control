# Add one restricted transport identity; existing root/chris access is retained.
AllowUsers control_auth_bridge@85.215.119.154

Match User control_auth_bridge
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/control-auth-bridge.keys
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:8020
    PermitListen none
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    ForceCommand /bin/false
Match all
